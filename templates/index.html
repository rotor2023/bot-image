<!DOCTYPE html><html><head><title>AI Image Bot</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;font-family:sans-serif;background:#0f0f0f;color:#fff;display:flex;flex-direction:column;height:100vh}header{padding:15px;text-align:center;background:#1a1a1a}#chat{flex:1;overflow-y:auto;padding:20px;max-width:700px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}.bubble{padding:12px 16px;border-radius:18px;max-width:85%}.user{align-self:flex-end;background:#0a84ff}.bot{align-self:flex-start;background:#222}.bot img{width:100%;border-radius:12px;margin-top:10px}#bar{display:flex;padding:15px;background:#1a1a1a;gap:10px;max-width:700px;width:100%;margin:0 auto}input{flex:1;padding:14px;border-radius:25px;border:none;background:#2a2a2a;color:#fff}#send{padding:14px 24px;border-radius:25px;border:none;background:#0a84ff;color:#fff}</style></head><body><header>🤖 Chatbot Image - Ready Hosting</header><div id="chat"><div class="bubble bot">Halo! Kirim prompt, aku bikinin gambarnya.<br>Contoh: kucing samurai di Medan</div></div><div id="bar"><input id="prompt" placeholder="Tulis prompt..." onkeydown="if(event.key==='Enter')send()"><button id="send" onclick="send()">Kirim</button></div><script>async function send(){const i=document.getElementById('prompt');const p=i.value.trim();if(!p)return;const c=document.getElementById('chat');c.innerHTML+=`<div class="bubble user">${p}</div>`;i.value='';const id='l'+Date.now();c.innerHTML+=`<div id="${id}" class="bubble bot">⏳ Generate...</div>`;c.scrollTop=9999;try{const r=await fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})});const d=await r.json();document.getElementById(id).remove();c.innerHTML+=`<div class="bubble bot"><b>${d.prompt}</b><br><img src="${d.image_url}"><br><a href="${d.image_url}" target="_blank" style="color:#0a84ff;font-size:12px">Full HD</a></div>`;}catch(e){document.getElementById(id).innerHTML='❌ Gagal';}c.scrollTop=9999;}</script></body></html>
